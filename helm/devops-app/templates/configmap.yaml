apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devops-app.fullname" . }}
  labels:
    {{- include "devops-app.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.app.port | quote }}
  APP_ENV: {{ .Values.app.environment | quote }}
  APP_VERSION: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
  {{- with .Values.app.logFile }}
  LOG_FILE: {{ . | quote }}
  {{- end }}
